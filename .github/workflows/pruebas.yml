# Las pruebas en cada empujón y en cada PR.
#
# La base analítica NO está en el repositorio (son 116 MB de datos ficticios), así
# que se genera aquí. Con ASTROLABIO_DEMO_RAPIDO=1 sale 20 veces más chica: la
# FORMA es la misma —las cinco trampas siguen ahí— y lo único que baja es el
# volumen, que en CI no aporta nada.

name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # unixodbc: sin él, importar pyodbc falla y no arranca ni la aplicación.
      - run: sudo apt-get update && sudo apt-get install -y unixodbc unixodbc-dev

      - run: pip install -r requirements.txt
      - name: Pruebas
        env:
          ASTROLABIO_DEMO_RAPIDO: '1'
        run: pytest -q
      - name: Vulnerabilidades conocidas
        run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx oxlint src
      - run: npm run build
