# Las pruebas en cada empujón y en cada PR.
#
# La base analítica NO está en el repositorio (son 116 MB de datos ficticios), así
# que se genera aquí. Con ASTROLABIO_DEMO_RAPIDO=1 sale 20 veces más chica: la
# FORMA es la misma —las cinco trampas siguen ahí— y lo único que baja es el
# volumen, que en CI no aporta nada.

name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # unixodbc: sin él, importar pyodbc falla y no arranca ni la aplicación.
      - run: sudo apt-get update && sudo apt-get install -y unixodbc unixodbc-dev

      - run: pip install -r requirements.txt
      - name: Pruebas
        env:
          ASTROLABIO_DEMO_RAPIDO: '1'
        run: pytest -q
      - name: Vulnerabilidades conocidas
        run: pip-audit

  # Windows no es un extra: hay instalaciones que corren nativas en Windows
  # Server, porque es donde vive el driver ODBC de Pervasive. Que funcione ahí
  # tiene que estar probado, no supuesto.
  #
  # No hace falta instalar nada de ODBC: Windows trae su propio administrador de
  # orígenes, así que `import pyodbc` funciona tal cual. Lo que no trae son los
  # drivers de cada origen, igual que en Linux.
  backend-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas
        env:
          ASTROLABIO_DEMO_RAPIDO: '1'
        run: pytest -q

      # El guion de instalacion se escribe en una maquina que no es Windows, asi
      # que aqui es donde se comprueba que funciona. Una errata descubierta en el
      # servidor de produccion es una tarde perdida.
      - name: El guion de instalacion es PowerShell valido
        working-directory: .
        run: |
          $errores = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path .\instalar-windows.ps1), [ref]$null, [ref]$errores) | Out-Null
          if ($errores) { $errores | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "Sintaxis correcta."

      # DOS veces, y la segunda es la que importa: Windows Server 2019 trae
      # **Windows PowerShell 5.1**, no pwsh 7. Se comportan distinto justo donde
      # duele —el entrecomillado que se pasa a un programa externo, y que la
      # salida de error de un programa aborte el guion— y el destino real de esto
      # es un Server 2019. Probarlo solo en pwsh es probar otra cosa.
      - name: El guion detecta sus requisitos (pwsh 7)
        working-directory: .
        run: .\instalar-windows.ps1 -Comprobar

      - name: El guion detecta sus requisitos (Windows PowerShell 5.1)
        working-directory: .
        shell: powershell
        run: .\instalar-windows.ps1 -Comprobar

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx oxlint src
      - run: npm run build
