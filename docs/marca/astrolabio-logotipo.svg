    <path d="M28 7v5M28 44v5M7 28h5M44 28h5" opacity="0.7"/>
    <path d="M15 41 41 15" opacity="0.9"/>
  </g>
  <circle cx="36" cy="36" r="3.5" fill="#4c8dff"/>
  <text x="76" y="45"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="-0.5" fill="currentColor">Astrolabio</text>
