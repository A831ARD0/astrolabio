<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Astrolabio">
  <title>Astrolabio</title>
  <!--
    El símbolo es un astrolabio reducido a lo que hacía: un anillo graduado (el
    limbo), la regla que apunta (la alidada) y el punto medido.

    Se dibuja con líneas y no con relleno para que a 16 px siga leyéndose: un
    favicon macizo se convierte en una mancha. Todo hereda `currentColor`, así que
    el mismo archivo sirve en claro, en oscuro y en una sola tinta.
  -->
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <circle cx="32" cy="32" r="24" opacity="0.95"/>
    <circle cx="32" cy="32" r="15" opacity="0.45"/>
    <!-- Graduaciones: sólo cuatro, las que sobreviven al tamaño pequeño. -->
    <path d="M32 8v6M32 50v6M8 32h6M50 32h6" opacity="0.7"/>
    <!-- La alidada, inclinada: es lo que da la lectura. -->
    <path d="M17 47 47 17" opacity="0.9"/>
  </g>
  <circle cx="32" cy="32" r="4" fill="currentColor"/>
</svg>
