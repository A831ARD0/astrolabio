; Migraciones del esquema de metadatos.
;
; La URL de la base NO va aqui: la lee migraciones/env.py de la configuracion de
; la aplicacion, para que no haya dos sitios donde cambiarla.

[alembic]
script_location = migraciones
prepend_sys_path = .
# Sin esto, Alembic avisa en cada arranque de que va a partir la ruta a la
# antigua (por espacios y comas). 'os' significa: el separador del sistema.
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generico

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
