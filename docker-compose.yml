# Astrolabio — las MISMAS imagenes en desarrollo y en produccion.
#
#   docker compose up -d
#
# La diferencia entre desarrollo y produccion es el archivo `.env`, no un compose
# distinto: con `ASTROLABIO_ENTORNO=produccion` el arranque exige las dos claves
# de verdad y se niega a levantar con las de ejemplo.
#
# Funciona igual en Linux, macOS y Windows (Docker Desktop con WSL 2). En Windows,
# ojo con los drivers ODBC: los contenedores son Linux y NO pueden cargar un driver
# de Windows. Esta explicado en el manual tecnico, seccion de Windows.
#
# Dos servicios a proposito. Con un solo mantenedor, cada servicio extra es algo
# mas que administrar, respaldar y que puede fallar de noche.

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ASTROLABIO_ENTORNO: ${ASTROLABIO_ENTORNO:-desarrollo}
      ASTROLABIO_CLAVE_SECRETA: ${ASTROLABIO_CLAVE_SECRETA:-cambiame-en-produccion}
      ASTROLABIO_CLAVE_CIFRADO: ${ASTROLABIO_CLAVE_CIFRADO:-}
      ASTROLABIO_RUTA_DUCKDB: /app/analitico/astrolabio.duckdb
      # ASTROLABIO_DUCKDB_SOLO_LECTURA se queda en su valor por omision, que es
      # `true`. La API no escribe en el motor analitico —escribe Parquet—, y el
      # archivo lo crea `asegurar_base()` al arrancar, asi que abrirlo para
      # escritura no habilita nada y si quita la red de seguridad.
      ASTROLABIO_ORIGENES_CORS: '["http://localhost:5173"]'
    volumes:
      # metadatos: un solo archivo SQLite. Respaldar = copiar este directorio.
      - metadatos:/app/datos
      # base analitica y Parquet
      - analitico:/app/analitico
    ports:
      # Solo a la maquina local: quien entra de fuera pasa por Caddy, que es el
      # que tiene HTTPS y las cabeceras de seguridad. Publicar 8000 al exterior
      # deja una puerta sin nada de eso delante.
      - "127.0.0.1:8000:8000"

  web:
    # Se construye —no es la imagen pelada de Caddy— porque la etapa de node
    # compila la interfaz aqui dentro. Asi el servidor no necesita Node.
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      # El Caddyfile va montado, no dentro de la imagen: cambiar el dominio no
      # deberia obligar a reconstruir nada.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  metadatos:
  analitico:
  caddy_datos:
  caddy_config:
